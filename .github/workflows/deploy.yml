name: Deploy Alyusr

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Build application
      run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Create deployment package
      run: |
        mkdir -p deploy
        cp -r .next deploy/
        cp -r public deploy/ 2>/dev/null || true
        cp package.json package-lock.json deploy/
        cp next.config.* deploy/ 2>/dev/null || true
        cd deploy && tar -czf ../alyusr-deploy.tar.gz .
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: alyusr-build
        path: alyusr-deploy.tar.gz
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 65.20.74.159
        username: milestonehre
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Create backup
          cd /home/milestonehre/Alyusr
          if [ -d ".next" ]; then
            sudo cp -r .next .next.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          # Pull latest code
          git fetch origin
          git reset --hard origin/main 2>/dev/null || git reset --hard origin/master
          
          # Install production dependencies
          npm ci --production
          
          # Build application
          npm run build
          
          # Restart PM2 process
          pm2 restart alyusr || pm2 start npm --name "alyusr" -- start -- --port 3006
          
          # Wait for app to start
          sleep 10
    
    - name: Health check
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 65.20.74.159
        username: milestonehre
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Check if the application is responding
          for i in {1..5}; do
            if curl -f http://localhost:3006 > /dev/null 2>&1; then
              echo "✅ Application is healthy"
              exit 0
            fi
            echo "⏳ Attempt $i: Waiting for application..."
            sleep 10
          done
          echo "❌ Application health check failed"
          exit 1
    
    - name: Rollback on failure
      if: failure()
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 65.20.74.159
        username: milestonehre
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🔄 Deployment failed, attempting rollback..."
          cd /home/milestonehre/Alyusr
          
          # Find latest backup
          BACKUP=$(ls -t .next.backup.* 2>/dev/null | head -n1)
          if [ -n "$BACKUP" ]; then
            echo "📦 Restoring from backup: $BACKUP"
            rm -rf .next
            mv "$BACKUP" .next
            pm2 restart alyusr
            echo "✅ Rollback completed"
          else
            echo "❌ No backup found for rollback"
            pm2 restart alyusr
          fi